<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - CBT & LMS SMA Kartika III-1 Banyubiru</title>
    <link rel="icon" type="image/png" href="/images/pwa-icon-192.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #061d13 0%, #0b3120 50%, #061d13 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 24px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 10px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #c5e5d6;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            background: #f59e0b;
            color: #061d13;
            font-weight: 800;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.15s, background 0.15s;
        }
        .btn:hover {
            background: #fbbf24;
            transform: scale(1.02);
        }
        .status-pill {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/pwa-icon-192.png" alt="Logo SMA Kartika III-1" class="logo">
        <div class="status-pill">📡 Sambungan Terputus</div>
        <h1>Anda Sedang Offline</h1>
        <p>
            Tidak dapat terhubung ke server CBT & LMS SMA Kartika III-1 Banyubiru. Periksa koneksi Wi-Fi atau data seluler Anda, lalu coba muat ulang halaman.
        </p>
        <button onclick="window.location.reload()" class="btn">Coba Muat Ulang</button>
    </div>
</body>
</html>
